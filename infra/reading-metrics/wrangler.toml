name = "mypaper-reading-metrics"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
[vars]
ENABLE_COLLECTOR = "true"
[observability]
enabled = false
[observability.logs]
enabled = false
invocation_logs = false
persist = false
[triggers]
crons = ["0 3 * * *"]
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "897653102"
  [ratelimits.simple]
  limit = 30
  period = 60
[[d1_databases]]
binding = "DB"
database_name = "mypaper-reading-metrics"
database_id = "5a8cae6c-d657-4a62-b852-ab9bad83abce"
