# Postaví web a vystaví ho na internet.
# Spouští se automaticky po každé změně obsahu.
name: "3 · Publikace webu"

on:
  schedule:
    - cron: "25 */2 * * *"      # kazde 2 hodiny, aby web nikdy nezustal pozadu
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "static/**", "data/**", "engine/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Redakční a technické testy
        run: python -m unittest discover -s tests -v

      - name: Připravit čerstvý záložní snapshot živých zpráv
        continue-on-error: true
        run: python -m engine.livefeed

      - name: Postavit web (a stáhnout chybějící obrázky)
        run: python -m engine.build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4

      # Když je web venku, ohlásí se nové články přes IndexNow — Bing,
      # Seznam a Yandex je pak mají do pár minut místo za pár dní.
      # Posílají se výhradně adresy našich článků, nic o čtenářích.
      # Kdyby se ohlášení nepovedlo, nevadí: vyhledávače si web najdou i samy.
      - name: Ohlásit nové články vyhledávačům (IndexNow)
        continue-on-error: true
        run: python -m engine.seo

      # Cache commit je až po nasazení. Jeho push tedy už nemůže zrušit
      # vlastní dosud nedokončené zveřejnění přes concurrency skupinu pages.
      - name: Uložit stažené obrázky, ať se příště nestahují znovu
        continue-on-error: true
        run: |
          git config user.name  "newsroom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/covers data/images.json data/admin-index.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "[bot] obrázky $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push || true
