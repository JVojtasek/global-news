# Hlavní denní běh redakce v režimu bez placeného modelového API.
#  1) přijme články z naplánovaných úloh ChatGPT Work (content/inbox/)
#  2) vydá splatný článek ze zásoby
#  3) spustí bezpečnostní testy a připraví sociální výstupy
#
# Záměrně se nenačítají OPENAI_API_KEY ani ANTHROPIC_API_KEY. Ani jejich
# případná existence v GitHub Secrets nemůže v tomto workflow spustit placený model.
name: "2 · Redakce"

on:
  schedule:
    - cron: "35 9 * * *"        # po dokončení šesti úloh + rezervy ChatGPT Work
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsroom-write
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Převzít vlastní články z QMA
        continue-on-error: true
        run: python -m engine.qma

      - name: Převzít články ze zdrojů, které to dovolují
        continue-on-error: true
        run: python -m engine.syndicate

      - name: Přijmout články z inboxu
        run: python -m engine.inbox

      - name: Vydat článek ze zásoby
        run: python -m engine.release

      - name: Redakční bezpečnostní testy
        run: python -m unittest discover -s tests -v

      - name: Sdílet na sociální sítě
        continue-on-error: true
        env:
          BLUESKY_HANDLE:       ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m engine.social prepare
          python -m engine.social send

      - name: Kontrola zdraví
        continue-on-error: true
        run: python -m engine.doctor

      - name: Uložit
        run: |
          git config user.name  "newsroom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/ data/
          git diff --staged --quiet || git commit -m "[bot] redakce $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
