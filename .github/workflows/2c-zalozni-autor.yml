# PRŮBĚŽNÁ UZÁVĚRKA — vydání není vázané na jediný přesný čas.
#
# Proč: `2-redakce.yml` uzavírá vydání jednou denně v 11:35 pražského času.
# Kdo nestihl dodat článek do té minuty, čekal do zítra. Tenhle workflow
# uzávěrku otevírá znovu každé dvě hodiny přes den: vezme, co mezitím
# přibylo v `content/inbox/`, prožene to redakčním sítem a vydá.
#
# NÁKLADY: NULA. Repozitář je veřejný → minuty GitHub Actions jsou zdarma.
# Žádný krok tady nevolá placené modelové API a nenačítá žádný API klíč —
# hlídá to `tests/test_free_launch.py`. Články píší předplacení asistenti
# (ranní směna Claude Code na Jardově počítači, úlohy ChatGPT Work a Cowork),
# GitHub je jen přebírá, kontroluje a vydává.
name: "2c · Průběžná uzávěrka"

on:
  schedule:
    # Každé dvě hodiny přes den (UTC). Praha = +2 h.
    # 05:40 = 07:40 Praha, poslední 19:40 = 21:40 Praha.
    - cron: "40 5,7,9,11,13,15,17,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Stejná skupina jako 2-redakce a 2b-intraday — dva zápisy do repozitáře
# se nikdy nepotkají.
concurrency:
  group: newsroom-write
  cancel-in-progress: false

jobs:
  uzaverka:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Plán vydání je deterministický a zadarmo — jen se přepočítá,
      # aby ho měli autoři i hlídač k dispozici i mimo ranní běh.
      - name: Přepočítat dnešní vydání
        run: python -m engine.edition

      # Přesně stejné síto jako v ranní uzávěrce. Žádná zkratka:
      # co neprojde, skončí v content/inbox/_rejected/ i s důvodem.
      - name: Přijmout články z inboxu (redakční síto)
        run: python -m engine.inbox

      - name: Vydat článek ze zásoby
        run: python -m engine.release

      - name: Redakční bezpečnostní testy
        run: python -m unittest discover -s tests

      - name: Kontrola zdraví
        continue-on-error: true
        run: python -m engine.doctor

      # Read-only přehled, co dnešnímu vydání pořád chybí. Nikdy neblokuje —
      # díra ve vydání není důvod zahodit články, které dorazily.
      - name: Co vydání ještě chybí
        continue-on-error: true
        run: python -m engine.edition_guard

      - name: Uložit
        run: |
          git config user.name  "newsroom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/ data/
          git diff --staged --quiet || git commit -m "[bot] prubezna uzaverka $(date -u +%Y-%m-%d\ %H:%M)"
          git pull --rebase --autostash
          git push
