  - id: health
    en: "Health — what should we watch for you"
    cs: "Zdraví — co pro tebe máme hlídat"
    note_en: "Tick anything you want us to prioritise. This stays on your device. We never send it anywhere, we do not have an account system, and we cannot see it. We do not give medical advice — we surface research, prevention and practical information, and we always name the source."
    note_cs: "Zaškrtni, co ti máme upřednostňovat. Zůstane to jen v tomhle zařízení. Nikam se to neposílá, žádné účty nevedeme a nemáme k tomu přístup. Nedáváme lékařské rady — hledáme výzkum, prevenci a praktické informace a vždycky uvádíme zdroj."
