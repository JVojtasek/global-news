# =====================================================================
#  ZÁJMY ČTENÁŘE
#  Z tohohle seznamu si čtenář při první návštěvě naklikne, co ho zajímá.
#  Web pak jeho témata upřednostní — ale nikdy je nedělá jedinými.
#
#  match = anglická slova, podle kterých systém pozná, že článek do
#          téhle škatulky patří. Je to obyčejný regulární výraz.
#          Články jsou v angličtině, proto se hledá anglicky i tehdy,
#          když se čte česká verze.
#
#  Přidat zájem = přidat řádek. Nic víc dělat nemusíš.
#
#  POZOR na skupinu health: to, co si tam čtenář naklikne, jsou údaje
#  o zdraví. Nikdy neopouštějí jeho zařízení — neukládáme je na server,
#  neposíláme je nikam a nemáme k nim přístup. Tak to musí zůstat.
# =====================================================================

