# =====================================================================
#  BEZPLATNÁ ZAKLÁDAJÍCÍ FÁZE
#
#  My Paper nyní buduje kvalitu, důvěru a pravidelnou čtenářskou obec.
#  Veškerý obsah je veřejný. Neexistuje placená zeď, předčasný přístup
#  ani texty schované jen pro platící. Platby se budou posuzovat teprve
#  podle skutečné návratovosti, reakcí čtenářů a stabilní kvality.
#
#  Tohle nastavení zachovává technickou možnost členství do budoucna,
#  ale veřejný web teď zobrazuje pouze bezplatný program Founding Readers.
# =====================================================================

# false = access: early se vydá rovnou veřejně. Nové články nesmějí používat
# access: members, dokud není zapojená skutečná rozesílka a výslovně schválená
# nová členská strategie.
enabled: false

# Bezplatná e-mailová služba zatím není připojená. Po jejím založení stačí
# doplnit provider a adresu formuláře; žádný tajný klíč nepatří do repozitáře.
provider: ""            # mailerlite | beehiiv | buttondown | ghost | ""
form_action: ""
field_name: "email"
early_days: 0

tiers:
  - id: free
    price_eur: 0
    en: "Founding Reader"
    cs: "Zakládající čtenář"
    blurb_en: "Help shape a calmer, more useful global paper while every article remains open to everyone."
    blurb_cs: "Pomoz utvářet klidnější a užitečnější světové noviny, zatímco všechny články zůstávají otevřené všem."
    perks_en:
      - "Every article, briefing and quiz stays free to read."
      - "A free reader letter once the e-mail list is connected."
      - "A direct route to suggest topics and tell us what was genuinely useful."
      - "No behavioural profiles and no selling or renting your address."
    perks_cs:
      - "Všechny články, briefingy a kvízy zůstávají volně přístupné."
      - "Bezplatný čtenářský e-mail, jakmile připojíme rozesílku."
      - "Přímá možnost navrhovat témata a říct, co bylo skutečně užitečné."
      - "Žádné behaviorální profily ani prodej či pronájem e-mailové adresy."
